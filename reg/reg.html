<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELOCE - Modal</title>
  <link rel="stylesheet" href="./reg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="modal-overlay">
    <div class="auth-modal">
      
      <button class="modal-close-btn" aria-label="Close modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="modal-header">
        <h2 class="modal-logo">VELOCE</h2>
        <p class="modal-subtitle">The Pinnacle of Automotive Excellence.</p>
      </div>

      <div class="auth-tabs">
        <button class="tab-btn active" id="tabSignIn" onclick="switchTab('signin')">SIGN IN</button>
        <button class="tab-btn" id="tabSignUp" onclick="switchTab('signup')">SIGN UP</button>
      </div>

      <form class="auth-form active" id="formSignIn" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="signin-email">EMAIL ADDRESS</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input type="email" id="signin-email" placeholder="name@luxury.com" required>
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="signin-password">PASSWORD</label>
            <a href="#" class="forgot-link">FORGOT?</a>
          </div>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="signin-password" value="........" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn-submit">SIGN IN TO YOUR FLEET</button>

        <div class="divider">
          <span>OR CONTINUE WITH</span>
        </div>

        <div class="social-auth">
          <button type="button" class="btn-social">GOOGLE</button>
          <button type="button" class="btn-social">APPLE</button>
        </div>

        <div class="modal-footer">
          <p>Don't have an account? <a href="#" class="signup-link" onclick="switchTab('signup')">Start your journey</a></p>
        </div>
      </form>

      <form class="auth-form" id="formSignUp" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="signup-name">FULL NAME</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="signup-name" placeholder="John Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">EMAIL ADDRESS</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input type="email" id="signup-email" placeholder="name@luxury.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">CREATE PASSWORD</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="signup-password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn-submit">CREATE AN ACCOUNT</button>

        <div class="divider">
          <span>OR CONTINUE WITH</span>
        </div>

        <div class="social-auth">
          <button type="button" class="btn-social">GOOGLE</button>
          <button type="button" class="btn-social">APPLE</button>
        </div>

        <div class="modal-footer">
          <p>Already have an account? <a href="#" class="signup-link" onclick="switchTab('signin')">Sign in</a></p>
        </div>
      </form>

    </div>
  </div>

  <script>
    function switchTab(type) {
      const tabSignIn = document.getElementById('tabSignIn');
      const tabSignUp = document.getElementById('tabSignUp');
      const formSignIn = document.getElementById('formSignIn');
      const formSignUp = document.getElementById('formSignUp');

      if (type === 'signin') {
        tabSignIn.classList.add('active');
        tabSignUp.classList.remove('active');
        formSignIn.classList.add('active');
        formSignUp.classList.remove('active');
      } else {
        tabSignUp.classList.add('active');
        tabSignIn.classList.remove('active');
        formSignUp.classList.add('active');
        formSignIn.classList.remove('active');
      }
    }
  </script>

</body>
</html>
